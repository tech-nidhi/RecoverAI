<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecoverAI — AI CFO Copilot & Revenue Control Plane</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3.5 3.5H9.5V28.5H3.5V3.5Z' fill='%23D6A43A'/%3E%3Cpath d='M9.5 3.5H20.5L27 10L20.5 16.5H9.5V11.5H19.5L21.5 10L19.5 8.5H9.5V3.5Z' fill='%23D6A43A'/%3E%3Cpath d='M13.5 16H19.5L27.5 28.5H20.5L13.5 18V16Z' fill='%23D6A43A'/%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Instrument Serif, JetBrains Mono, Space Grotesk, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ledger-bg': '#050505',
            'ledger-card': '#0D0D0D',
            'ledger-card-subtle': '#121212',
            'ledger-border': '#1E1E1C',
            'amber-gold': '#D6A43A',
            'teal-success': '#35C7A0',
            'danger-red': '#D85C5C',
            'text-primary': '#F2F0EA',
            'text-muted': '#8A8A84',
          },
          fontFamily: {
            serif: ['Instrument Serif', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
            heading: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050505;
      color: #F2F0EA;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .font-serif-headline {
      font-family: 'Instrument Serif', serif;
    }

    .font-jetbrains {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-space {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Financial Ledger Grid Overlay */
    .ledger-grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.14;
    }

    /* Ticker animation */
    @keyframes tickerScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .animate-ticker {
      display: inline-block;
      white-space: nowrap;
      animation: tickerScroll 35s linear infinite;
    }

    .animate-ticker:hover {
      animation-play-state: paused;
    }

    /* System Panel Cards */
    .ledger-panel {
      background-color: #0D0D0D;
      border: 1px solid #1E1E1C;
    }

    .ledger-panel-gold {
      background-color: #0F0E0A;
      border: 1px solid rgba(214, 164, 58, 0.35);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #1E1E1C; }
  </style>
</head>
<body class="min-h-screen relative selection:bg-amber-gold/30 selection:text-amber-gold">

  <!-- Financial Ledger Grid Background -->
  <svg class="ledger-grid-overlay" xmlns="http://www.w3.org/2000/svg">
    <pattern id="ledger-pattern" width="160" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="39" x2="160" y2="39" stroke="#8A8A84" stroke-width="0.5" />
      <line x1="159" y1="0" x2="159" y2="40" stroke="#8A8A84" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#ledger-pattern)" />
  </svg>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // -------------------------------------------------------------------------
    // 1. TOP LIVE AUDIT TICKER COMPONENT
    // -------------------------------------------------------------------------
    function AuditTicker() {
      const tickerItems = [
        { id: 'txn_8f2a1c', action: 'RECOVERED', amount: '₹1,249', status: 'SUCCESS' },
        { id: 'txn_3c91b7', action: 'RETRY_ATTEMPT_2', amount: '₹4,890', status: 'ACTIVE' },
        { id: 'txn_9a7d11', action: 'POLICY_OVERRIDE', amount: '₹22,000', status: 'BLOCKED' },
        { id: 'txn_4d0e2b', action: 'RECOVERED', amount: '₹2,799', status: 'SUCCESS' },
        { id: 'txn_7e1f4a', action: 'PAYMENT_LINK_SENT', amount: '₹14,500', status: 'ACTIVE' },
        { id: 'txn_5b8c9d', action: 'RECOVERED', amount: '₹850', status: 'SUCCESS' },
      ];

      return (
        <div className="w-full bg-ledger-bg border-b border-ledger-border overflow-hidden py-1.5 font-jetbrains text-[11px]">
          <div className="max-w-7xl mx-auto flex items-center px-4">
            <span className="shrink-0 text-amber-gold font-bold uppercase tracking-wider mr-4 flex items-center">
              <span className="w-1.5 h-1.5 rounded-full bg-amber-gold animate-ping mr-2"></span>
              LIVE INTERVENTIONS
            </span>
            <div className="overflow-hidden relative w-full">
              <div className="animate-ticker space-x-8 text-text-muted">
                {tickerItems.concat(tickerItems).map((item, idx) => (
                  <span key={idx} className="inline-flex items-center space-x-2">
                    <span className="text-text-primary font-mono">{item.id}</span>
                    <span className={item.status === 'SUCCESS' ? 'text-teal-success font-bold' : item.status === 'BLOCKED' ? 'text-amber-gold' : 'text-text-muted'}>
                      {item.action} {item.amount}
                    </span>
                    <span className="text-ledger-border">│</span>
                  </span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 2. ASK RECOVERAI COPILOT QUERY PANEL COMPONENT
    // -------------------------------------------------------------------------
    function AskRecoverAICopilot({ onSelectCase, scrollToSimulator }) {
      const [query, setQuery] = useState('');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [showSources, setShowSources] = useState(false);

      const presets = [
        "Why did recovery drop today?",
        "Which customers should I follow up with?",
        "Why didn't RecoverAI retry this payment?",
        "What happens if I increase max retries to 3?"
      ];

      const handleQuery = async (qText) => {
        const targetQ = qText || query;
        if (!targetQ.trim()) return;

        setLoading(true);
        try {
          const res = await fetch('/copilot/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: targetQ })
          });
          const data = await res.json();
          setResponse(data);
        } catch (e) {
          console.error("Copilot query failed", e);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="ledger-panel p-6 space-y-5 font-jetbrains">
          <div className="flex items-center justify-between border-b border-ledger-border pb-3">
            <div className="flex items-center space-x-2 text-amber-gold font-bold">
              <span className="w-2 h-2 rounded-full bg-amber-gold"></span>
              <span className="uppercase tracking-widest text-xs">ASK RECOVERAI // OPERATIONAL COPILOT</span>
            </div>
            <span className="text-[10px] text-text-muted">EVIDENCE-GROUNDED QUERY INTERFACE</span>
          </div>

          {/* Search Input Bar */}
          <div className="flex space-x-2">
            <input
              type="text"
              placeholder="Ask about your recovery pipeline, policy rules, or strategy..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleQuery()}
              className="w-full bg-ledger-bg border border-ledger-border text-text-primary px-4 py-2.5 text-xs font-mono focus:border-amber-gold focus:outline-none"
            />
            <button
              onClick={() => handleQuery()}
              disabled={loading}
              className="px-5 py-2.5 bg-amber-gold text-ledger-bg font-bold text-xs uppercase hover:bg-amber-gold/90 transition"
            >
              {loading ? 'ANALYZING...' : 'QUERY'}
            </button>
          </div>

          {/* Suggested Preset Queries */}
          <div className="flex flex-wrap gap-2 text-[10px] text-text-muted">
            <span className="py-1">Suggested Operational Queries:</span>
            {presets.map((p, idx) => (
              <button
                key={idx}
                onClick={() => { setQuery(p); handleQuery(p); }}
                className="px-2.5 py-1 bg-ledger-card-subtle border border-ledger-border hover:border-amber-gold hover:text-text-primary transition"
              >
                {p}
              </button>
            ))}
          </div>

          {/* Structured Evidence-Backed Response Display */}
          {response && (
            <div className="bg-ledger-card-subtle p-5 border border-ledger-border space-y-4 text-xs">
              
              {/* Answer & Confidence */}
              <div className="space-y-1">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] text-amber-gold font-bold uppercase tracking-wider">OPERATIONAL ANALYSIS</span>
                  <span className="text-[10px] text-teal-success font-bold px-2 py-0.5 bg-teal-success/10 border border-teal-success/30">
                    CONFIDENCE: {response.confidence}
                  </span>
                </div>
                <p className="text-text-primary font-sans leading-relaxed text-sm">
                  {response.answer}
                </p>
              </div>

              {/* Policy Explanation Component (Subordinate AI Principle) */}
              {response.policy_explanation && (
                <div className="bg-amber-gold/10 border border-amber-gold/40 p-3 space-y-2 text-xs">
                  <div className="text-[10px] text-amber-gold font-bold uppercase tracking-wider">
                    SUBORDINATE AI POLICY CHECK
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">
                    <div><span className="text-text-muted block">AI RECOMMENDATION</span><span className="font-bold text-text-primary">{response.policy_explanation.ai_recommendation}</span></div>
                    <div><span className="text-text-muted block">POLICY RULE</span><span className="font-bold text-amber-gold">{response.policy_explanation.policy_rule}</span></div>
                    <div><span className="text-text-muted block">ATTEMPTS</span><span className="font-bold text-text-primary">{response.policy_explanation.current_attempts}</span></div>
                    <div><span className="text-text-muted block">FINAL DECISION</span><span className="font-bold text-amber-gold">{response.policy_explanation.final_decision}</span></div>
                  </div>
                </div>
              )}

              {/* Simulation Preview Component */}
              {response.simulation_preview && (
                <div className="bg-ledger-bg p-3 border border-ledger-border space-y-3">
                  <div className="flex items-center justify-between text-[10px] text-amber-gold font-bold uppercase tracking-wider">
                    <span>COUNTERFACTUAL SIMULATION PREVIEW</span>
                    <button onClick={scrollToSimulator} className="text-amber-gold hover:underline">
                      OPEN FULL SIMULATOR →
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-3 text-center text-xs">
                    <div className="bg-ledger-card p-2 border border-ledger-border">
                      <span className="text-[10px] text-text-muted block">CURRENT ({response.simulation_preview.current_policy})</span>
                      <span className="font-bold text-text-primary">{response.simulation_preview.current_recovery}</span>
                    </div>
                    <div className="bg-ledger-card p-2 border border-ledger-border">
                      <span className="text-[10px] text-text-muted block">PROPOSED ({response.simulation_preview.proposed_policy})</span>
                      <span className="font-bold text-teal-success">{response.simulation_preview.proposed_recovery}</span>
                    </div>
                    <div className="bg-teal-success/10 p-2 border border-teal-success/30">
                      <span className="text-[10px] text-teal-success block">INCREMENTAL LIFT</span>
                      <span className="font-bold text-teal-success">{response.simulation_preview.incremental_recovery}</span>
                    </div>
                  </div>
                </div>
              )}

              {/* Clickable Evidence Chips */}
              {response.evidence && response.evidence.length > 0 && (
                <div className="space-y-1.5 pt-2 border-t border-ledger-border">
                  <div className="text-[10px] text-text-muted font-bold uppercase tracking-wider">SUPPORTING DATA EVIDENCE</div>
                  <div className="flex flex-wrap gap-2">
                    {response.evidence.map((ev, idx) => (
                      <button
                        key={idx}
                        onClick={() => ev.case_id && onSelectCase(ev.case_id)}
                        className="px-2.5 py-1 bg-ledger-bg border border-amber-gold/40 text-amber-gold text-[11px] font-mono hover:bg-amber-gold/10 transition"
                      >
                        [{ev.label}] {ev.case_id ? '➔' : ''}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* View Fact Sources Button */}
              <div className="flex justify-between items-center text-[10px] text-text-muted pt-2 border-t border-ledger-border">
                <span>AI ANALYSIS SUBORDINATE TO DETERMINISTIC CONTROL</span>
                <button
                  onClick={() => setShowSources(!showSources)}
                  className="text-amber-gold hover:underline uppercase font-bold"
                >
                  {showSources ? 'HIDE SOURCES ▲' : 'VIEW SOURCES ▼'}
                </button>
              </div>

              {showSources && response.sources && (
                <div className="bg-ledger-bg p-3 border border-ledger-border text-[10px] font-mono space-y-1 text-text-muted">
                  <div className="font-bold text-text-primary uppercase">FACTUAL DATASET SOURCES RECORDED:</div>
                  {response.sources.map((s, idx) => (
                    <div key={idx}>• {s}</div>
                  ))}
                </div>
              )}

            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 3. DEDICATED AUDIT TRAIL VIEW COMPONENT
    // -------------------------------------------------------------------------
    function AuditTrailView({ cases, onSelectCase }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [eventTypeFilter, setEventTypeFilter] = useState('');
      const [outcomeFilter, setOutcomeFilter] = useState('');
      const [actorFilter, setActorFilter] = useState('');

      const defaultEvents = [
        { time: '11:04:17.421', event: 'PAYMENT_RECOVERED', txn_id: 'txn_8f2a1c', amount: 233468, actor: 'RECOVERY_ENGINE', result: '✓ SUCCESS', outcome: 'RECOVERED' },
        { time: '11:03:51.209', event: 'PAYMENT_LINK_SENT', txn_id: 'txn_92fa11', amount: 48920, actor: 'POLICY_ENGINE', result: 'EXECUTED', outcome: 'PENDING' },
        { time: '11:03:42.887', event: 'ESCALATION_TRIGGERED', txn_id: 'txn_7c812e', amount: 81240, actor: 'RECOVERY_ENGINE', result: 'ESCALATED', outcome: 'ESCALATED' },
        { time: '11:03:31.144', event: 'RETRY_SCHEDULED', txn_id: 'txn_91af21', amount: 12480, actor: 'POLICY_ENGINE', result: 'APPROVED', outcome: 'PENDING' },
        { time: '11:03:02.882', event: 'POLICY_MATCHED', txn_id: 'txn_81ab92', amount: 6920, actor: 'POLICY_ENGINE', result: 'RETRY_V2', outcome: 'PENDING' },
        { time: '11:02:49.104', event: 'RISK_SCORED', txn_id: 'txn_3c91b7', amount: 244952, actor: 'ML_ENGINE', result: '0.942 HIGH', outcome: 'PENDING' },
        { time: '11:02:48.231', event: 'PAYMENT_FAILED', txn_id: 'txn_9a7d11', amount: 243157, actor: 'SYSTEM', result: 'FAILED', outcome: 'FAILED' },
        { time: '11:01:14.002', event: 'POLICY_BLOCKED', txn_id: 'txn_5c12e8', amount: 112000, actor: 'POLICY_ENGINE', result: 'BLOCKED', outcome: 'BLOCKED' },
      ];

      const mappedBackendEvents = cases.map((c, i) => ({
        time: `10:${59 - (i % 60)}:${(10 + i * 7) % 60}.${100 + i * 13}`,
        event: c.outcome === 'SUCCESS' ? 'PAYMENT_RECOVERED' : c.final_action === 'STOP' ? 'POLICY_BLOCKED' : c.final_action === 'ESCALATE' ? 'ESCALATION_TRIGGERED' : 'ACTION_APPROVED',
        txn_id: c.event_id,
        customer_id: c.customer_id,
        amount: c.amount,
        actor: c.final_action === 'STOP' ? 'POLICY_ENGINE' : 'RECOVERY_ENGINE',
        result: c.outcome === 'SUCCESS' ? '✓ SUCCESS' : c.outcome,
        outcome: c.outcome === 'SUCCESS' ? 'RECOVERED' : c.outcome,
      }));

      const allEvents = mappedBackendEvents.length > 0 ? mappedBackendEvents : defaultEvents;

      const filteredEvents = allEvents.filter(ev => {
        if (searchQuery && !ev.txn_id.toLowerCase().includes(searchQuery.toLowerCase()) && !(ev.customer_id && ev.customer_id.toLowerCase().includes(searchQuery.toLowerCase()))) return false;
        if (eventTypeFilter && ev.event !== eventTypeFilter) return false;
        if (outcomeFilter && ev.outcome !== outcomeFilter) return false;
        if (actorFilter && ev.actor !== actorFilter) return false;
        return true;
      });

      return (
        <div className="max-w-7xl mx-auto px-6 py-10 space-y-8 font-jetbrains">
          
          {/* PAGE HEADER & OPERATIONAL STATS */}
          <div className="space-y-6 border-b border-ledger-border pb-8">
            <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="inline-flex items-center space-x-2 text-xs text-amber-gold font-bold uppercase tracking-widest mb-1">
                  <span className="w-2 h-2 rounded-full bg-amber-gold animate-ping"></span>
                  <span>AUDIT TRAIL // EVERY INTERVENTION LEAVES A TRACE.</span>
                </div>
                <h1 className="font-serif-headline text-5xl text-text-primary">
                  Financial Event Ledger & Trace
                </h1>
                <p className="font-sans text-xs text-text-muted max-w-2xl mt-2 leading-relaxed">
                  A complete, chronological record of every revenue recovery decision, policy evaluation, intervention, and outcome.
                </p>
              </div>

              <div className="flex items-center space-x-3 bg-ledger-card px-4 py-2 border border-ledger-border text-xs">
                <span className="text-text-muted">SYSTEM STATUS</span>
                <span className="text-teal-success font-bold flex items-center">
                  <span className="w-2 h-2 rounded-full bg-teal-success animate-pulse mr-1.5"></span>
                  ● LIVE AUDIT STREAM
                </span>
              </div>
            </div>

            {/* OPERATIONAL SYSTEM STATS */}
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs">
              <div className="ledger-panel p-3.5 text-center">
                <div className="text-[10px] text-text-muted uppercase font-bold">EVENTS TODAY</div>
                <div className="text-2xl font-bold text-text-primary mt-1">18,429</div>
              </div>
              <div className="ledger-panel p-3.5 text-center border-l-2 border-l-teal-success">
                <div className="text-[10px] text-text-muted uppercase font-bold">RECOVERED</div>
                <div className="text-2xl font-bold text-teal-success mt-1">₹24.8L</div>
              </div>
              <div className="ledger-panel p-3.5 text-center border-l-2 border-l-amber-gold">
                <div className="text-[10px] text-text-muted uppercase font-bold">INTERVENTIONS</div>
                <div className="text-2xl font-bold text-amber-gold mt-1">7,214</div>
              </div>
              <div className="ledger-panel p-3.5 text-center">
                <div className="text-[10px] text-text-muted uppercase font-bold">ESCALATIONS</div>
                <div className="text-2xl font-bold text-text-primary mt-1">382</div>
              </div>
              <div className="ledger-panel p-3.5 text-center border-l-2 border-l-danger-red">
                <div className="text-[10px] text-text-muted uppercase font-bold">POLICY BLOCKS</div>
                <div className="text-2xl font-bold text-danger-red mt-1">41</div>
              </div>
            </div>
          </div>

          {/* FILTER BAR */}
          <div className="ledger-panel p-4 flex flex-wrap items-center gap-3 text-xs">
            <input
              type="text"
              placeholder="SEARCH TRANSACTION / CUSTOMER..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="bg-ledger-bg border border-ledger-border text-text-primary px-3 py-2 text-xs font-mono focus:border-amber-gold w-64"
            />

            <select
              value={eventTypeFilter}
              onChange={(e) => setEventTypeFilter(e.target.value)}
              className="bg-ledger-bg border border-ledger-border text-text-primary px-3 py-2 text-xs font-mono focus:border-amber-gold"
            >
              <option value="">EVENT TYPE: ALL</option>
              <option value="PAYMENT_FAILED">PAYMENT FAILED</option>
              <option value="RISK_SCORED">RISK SCORED</option>
              <option value="POLICY_MATCHED">POLICY MATCHED</option>
              <option value="ACTION_APPROVED">ACTION APPROVED</option>
              <option value="RETRY_SCHEDULED">RETRY SCHEDULED</option>
              <option value="PAYMENT_LINK_SENT">PAYMENT LINK SENT</option>
              <option value="PAYMENT_RECOVERED">PAYMENT RECOVERED</option>
              <option value="ESCALATION_TRIGGERED">ESCALATED</option>
              <option value="POLICY_BLOCKED">POLICY BLOCKED</option>
            </select>

            <select
              value={outcomeFilter}
              onChange={(e) => setOutcomeFilter(e.target.value)}
              className="bg-ledger-bg border border-ledger-border text-text-primary px-3 py-2 text-xs font-mono focus:border-amber-gold"
            >
              <option value="">OUTCOME: ALL</option>
              <option value="RECOVERED">RECOVERED</option>
              <option value="PENDING">PENDING</option>
              <option value="ESCALATED">ESCALATED</option>
              <option value="FAILED">FAILED</option>
              <option value="BLOCKED">BLOCKED</option>
            </select>

            <select
              value={actorFilter}
              onChange={(e) => setActorFilter(e.target.value)}
              className="bg-ledger-bg border border-ledger-border text-text-primary px-3 py-2 text-xs font-mono focus:border-amber-gold"
            >
              <option value="">ACTOR: ALL</option>
              <option value="RECOVERY_ENGINE">RECOVERY ENGINE</option>
              <option value="ML_ENGINE">ML ENGINE</option>
              <option value="POLICY_ENGINE">POLICY ENGINE</option>
              <option value="SYSTEM">SYSTEM</option>
            </select>

            <div className="ml-auto flex items-center space-x-2 text-[10px] text-text-muted">
              <span>AUDIT INTEGRITY:</span>
              <span className="text-teal-success font-bold">✓ 100% AUDITABLE</span>
            </div>
          </div>

          {/* MAIN DENSE EVENT LEDGER TABLE */}
          <div id="audit-section" className="ledger-panel p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-ledger-border pb-3">
              <div className="text-xs text-amber-gold font-bold uppercase tracking-wider">
                DENSE CHRONOLOGICAL EVENT STREAM
              </div>

                    </div>
                  </div>
                </section>
              )}

          {/* RIGHT-SIDE TRANSACTION INVESTIGATION DRAWER MODAL                */}

          {selectedCase && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-end z-50 overflow-y-auto font-jetbrains">
              <div className={`ledger-panel max-w-2xl w-full h-full p-8 space-y-6 relative border-l-4 overflow-y-auto ${selectedCase.blocking_rule ? 'border-l-amber-gold' : 'border-l-teal-success'}`}>
                
                <button
                  onClick={() => setSelectedCase(null)}
                  className="absolute top-6 right-6 text-text-muted hover:text-text-primary text-2xl font-bold"
                >
                  ✕
                </button>

                {/* DRAWER HEADER SUMMARY */}

                  <div className="text-xs text-amber-gold font-bold uppercase tracking-widest">
                    RECOVERY TRACE // {selectedCase.event_id}
                  </div>
                  <h2 className="font-serif-headline text-4xl text-text-primary mt-1">
                    Customer: {selectedCase.customer_id}

                    TRACE ID: trace_7f91ac_{selectedCase.event_id}
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-ledger-card-subtle p-4 border border-ledger-border text-xs">

                    <span className="text-text-muted text-[10px] block">AMOUNT AT RISK</span>
                    <span className="font-bold text-text-primary text-sm">₹{selectedCase.amount.toLocaleString('en-IN')}</span>
                  </div>

                    <span className="text-text-muted text-[10px] block">RECOVERED</span>
                    <span className="font-bold text-teal-success text-sm">₹{selectedCase.revenue_recovered ? selectedCase.revenue_recovered.toLocaleString('en-IN') : Math.round(selectedCase.amount * selectedCase.recovery_probability).toLocaleString('en-IN')}</span>
                  </div>
                  <div>
                    <span className="text-text-muted text-[10px] block">RECOVERY PROB</span>
                    <span className="font-bold text-teal-success text-sm">{(selectedCase.recovery_probability * 100).toFixed(1)}%</span>
                  </div>
                  <div>
                    <span className="text-text-muted text-[10px] block">STATUS</span>
                    <span className={`font-bold ${selectedCase.outcome === 'SUCCESS' ? 'text-teal-success' : 'text-amber-gold'}`}>
                      {selectedCase.outcome === 'SUCCESS' ? 'RECOVERED ✓' : selectedCase.outcome}
                    </span>
                  </div>
                </div>

                {selectedCase.blocking_rule && (
                  <div className="bg-amber-gold/10 border border-amber-gold/40 p-3 text-xs text-amber-gold">
                    <span className="font-bold">⚠️ POLICY RULE OVERRIDE:</span> AI action <code className="bg-black px-1.5 py-0.5">{selectedCase.recommended_action}</code> blocked by rule <code className="bg-black px-1.5 py-0.5">{selectedCase.blocking_rule}</code>.
                  </div>
                )}

                {/* CHRONOLOGICAL RECOVERY TIMELINE */}
                <div className="space-y-4 pt-2">
                  <div className="text-xs text-amber-gold font-bold uppercase tracking-wider border-b border-ledger-border pb-2">

                  <div className="space-y-4 text-xs font-mono relative pl-4 border-l border-ledger-border">
                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-danger-red absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:02:48.231</div>
                      <div className="font-bold text-danger-red uppercase">PAYMENT_FAILED</div>
                      <div className="text-text-muted text-[11px]">Reason: INSUFFICIENT_FUNDS</div>
                    </div>

                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-amber-gold absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:02:49.104</div>
                      <div className="font-bold text-amber-gold uppercase">RISK_SCORED</div>
                      <div className="text-text-muted text-[11px]">
                        Probability: <span className="text-teal-success font-bold">{(selectedCase.recovery_probability * 100).toFixed(1)}%</span> | At risk: ₹{selectedCase.amount.toLocaleString('en-IN')}
                      </div>
                    </div>

                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-amber-gold absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:02:49.882</div>
                      <div className="font-bold text-amber-gold uppercase">POLICY_MATCHED</div>
                      <div className="text-text-muted text-[11px]">Matched policy: <span className="text-text-primary">high_value_retry_v2</span></div>
                    </div>

                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-amber-gold absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:02:50.114</div>
                      <div className="font-bold text-text-primary uppercase">ACTION_APPROVED</div>
                      <div className="text-text-muted text-[11px]">
                        Action: <span className="text-amber-gold font-bold">{selectedCase.recommended_action}</span> | Status: <span className="text-teal-success">✓ APPROVED</span>
                      </div>
                    </div>

                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-teal-success absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:04:17.421</div>
                      <div className="font-bold text-teal-success uppercase">PAYMENT_RECOVERED</div>
                      <div className="text-text-muted text-[11px]">
                        Amount Recovered: <span className="text-teal-success font-bold">₹{Math.round(selectedCase.amount * selectedCase.recovery_probability).toLocaleString('en-IN')}</span>
                      </div>
                    </div>

                    <div className="relative">
                      <span className="w-2 h-2 rounded-full bg-teal-success absolute -left-[21px] top-1"></span>
                      <div className="text-[10px] text-text-muted">11:04:17.502</div>
                      <div className="font-bold text-teal-success uppercase">CASE_CLOSED</div>
                      <div className="text-text-muted text-[11px]">Outcome: SUCCESS</div>
                    </div>
                  </div>
                </div>
              {/* POLICY DECISION TRACE */}

                  <div className="text-xs text-amber-gold font-bold uppercase tracking-wider border-b border-ledger-border pb-2">

                  </div>

                  <div className="bg-ledger-card-subtle p-4 border border-ledger-border space-y-2 text-xs">
                    <div className="grid grid-cols-2 gap-2 text-[11px]">
                      <div><span className="text-text-muted block">RISK SCORE</span><span className="font-bold text-teal-success">{(selectedCase.recovery_probability * 100).toFixed(1)}%</span></div>
                      <div><span className="text-text-muted block">CUSTOMER VALUE</span><span className="font-bold text-text-primary">HIGH</span></div>
                      <div><span className="text-text-muted block">PREVIOUS RETRIES</span><span className="font-bold text-text-primary">{selectedCase.attempt_count || 1} / 3</span></div>
                      <div><span className="text-text-muted block">COOLDOWN</span><span className="font-bold text-teal-success">SATISFIED</span></div>
                    </div>

                    <div className="pt-2 border-t border-ledger-border space-y-1 text-[11px] text-teal-success font-bold">

                      <div>✓ NO POLICY VIOLATION DETECTED</div>
                      <div>✓ EXECUTION AUTHORIZED BY DETERMINISTIC CONTROL</div>

                  <div className="grid grid-cols-5 gap-2 text-center text-[10px] font-mono py-2">
                    <div className="ledger-panel p-2">
                      <div className="text-text-muted">FAILED</div>
                      <div className="font-bold text-danger-red mt-0.5">PAYMENT</div>
                    </div>
                    <div className="ledger-panel p-2">
                      <div className="text-text-muted">RISK</div>
                      <div className="font-bold text-teal-success mt-0.5">{(selectedCase.recovery_probability * 100).toFixed(0)}%</div>
                    </div>
                    <div className="ledger-panel p-2 border-amber-gold">
                      <div className="text-amber-gold">POLICY</div>
                      <div className="font-bold text-amber-gold mt-0.5">ENGINE</div>
                    </div>
                    <div className="ledger-panel p-2">
                      <div className="text-text-muted">ACTION</div>
                      <div className="font-bold text-text-primary mt-0.5">{selectedCase.final_action}</div>
                    </div>
                    <div className="ledger-panel p-2 border-teal-success bg-teal-success/10">
                      <div className="text-teal-success">STATE</div>
                      <div className="font-bold text-teal-success mt-0.5">RECOVERED</div>
                    </div>
                  </div>
                </div>

                {/* AI DIAGNOSTIC REASONING */}
                <div className="space-y-1 pt-2">
                  <div className="text-[10px] uppercase text-text-muted font-bold">AI DIAGNOSTIC REASONING</div>
                  <div className="bg-ledger-card-subtle p-4 text-xs italic text-text-primary border border-ledger-border leading-relaxed">
                    "{selectedCase.reasoning_text}"
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-ledger-border text-xs text-text-muted">
                  <span>✓ 100% AUDITABLE SHA256 RECORD</span>
                  <button
                    onClick={() => setSelectedCase(null)}
                    className="px-5 py-2.5 bg-amber-gold text-ledger-bg font-bold uppercase hover:bg-amber-gold/90 transition"
                  >
                    CLOSE INVESTIGATION
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-ledger-border py-12 bg-ledger-bg text-text-muted font-jetbrains text-xs">
            <div className="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
              <div>
                <div className="flex items-center space-x-2.5 mb-1">
                  <AngularRLogo size={20} />
                  <span className="font-bold text-text-primary text-base font-jetbrains">Recover<span className="text-amber-gold">AI</span></span>
                </div>
                <p className="text-[11px] text-text-muted">AUTONOMOUS REVENUE RECOVERY CONTROL PLANE. BUILT FOR CONTROLLED EXECUTION.</p>
              </div>
              <div className="text-right text-[11px] text-text-muted">
                <span>© 2026 RecoverAI</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
