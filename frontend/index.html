  <style>

    /* Financial Ledger Grid Overlay */
    .ledger-grid-overlay {
      position: fixed;
      top: 0;
      left: 0;

      height: 100vh;

<body class="min-h-screen relative selection:bg-amber-gold/30 selection:text-amber-gold">

  <!-- Financial Ledger Grid Background -->

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Multi-tenant auth fetch helper
    const authFetch = async (url, options = {}) => {
      const token = localStorage.getItem('rai_session_token');
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
        headers['X-Session-Token'] = token;
      }
      return fetch(url, { ...options, headers });
    };

    const AngularRLogo = ({ size = 28, className = "" }) => (
      <svg
        width={size}
        height={size}
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        className={`inline-block shrink-0 ${className}`}
      >
        <path d="M3.5 3.5H9.5V28.5H3.5V3.5Z" fill="#D6A43A" />
        <path d="M9.5 3.5H20.5L27 10L20.5 16.5H9.5V11.5H19.5L21.5 10L19.5 8.5H9.5V3.5Z" fill="#D6A43A" />
        <path d="M13.5 16H19.5L27.5 28.5H20.5L13.5 18V16Z" fill="#D6A43A" />
      </svg>
    );

    // -------------------------------------------------------------------------
    // 1. TOP LIVE AUDIT TICKER COMPONENT
    // -------------------------------------------------------------------------
    function AuditTicker() {
      const tickerItems = [
        { id: 'txn_8f2a1c', action: 'RECOVERED', amount: '₹1,249', status: 'SUCCESS' },
        { id: 'txn_3c91b7', action: 'RETRY_ATTEMPT_2', amount: '₹4,890', status: 'ACTIVE' },
        { id: 'txn_9a7d11', action: 'POLICY_OVERRIDE', amount: '₹22,000', status: 'BLOCKED' },
        { id: 'txn_4d0e2b', action: 'RECOVERED', amount: '₹2,799', status: 'SUCCESS' },
        { id: 'txn_7e1f4a', action: 'PAYMENT_LINK_SENT', amount: '₹14,500', status: 'ACTIVE' },
        { id: 'txn_5b8c9d', action: 'RECOVERED', amount: '₹850', status: 'SUCCESS' },
      ];

      return (
        <div className="w-full bg-ledger-bg border-b border-ledger-border overflow-hidden py-1.5 font-jetbrains text-[11px]">
          <div className="max-w-7xl mx-auto flex items-center px-4">
            <span className="shrink-0 text-amber-gold font-bold uppercase tracking-wider mr-4 flex items-center">
              <span className="w-1.5 h-1.5 rounded-full bg-amber-gold animate-ping mr-2"></span>
              LIVE INTERVENTIONS
            </span>
            <div className="overflow-hidden relative w-full">
              <div className="animate-ticker space-x-8 text-text-muted">
                {tickerItems.concat(tickerItems).map((item, idx) => (
                  <span key={idx} className="inline-flex items-center space-x-2">
                    <span className="text-text-primary font-mono">{item.id}</span>
                    <span className={item.status === 'SUCCESS' ? 'text-teal-success font-bold' : item.status === 'BLOCKED' ? 'text-amber-gold' : 'text-text-muted'}>
                      {item.action} {item.amount}
                    </span>
                    <span className="text-ledger-border">│</span>
                  </span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 2. ASK RECOVERAI COPILOT QUERY PANEL COMPONENT
    // -------------------------------------------------------------------------
    function AskRecoverAICopilot({ onSelectCase, scrollToSimulator }) {
      const [query, setQuery] = useState('');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [showSources, setShowSources] = useState(false);
      const [confirmLoading, setConfirmLoading] = useState(false);
      const [confirmMessage, setConfirmMessage] = useState(null);

      const presets = [
        "Why did recovery change today?",
        "What are the top revenue-at-risk cases?",
        "Why was this recovery blocked?",
        "Which recovery action performs best?",
        "What happens if max retries increases to 3?",
        "Is RecoverAI operating normally?"
      ];

      const handleQuery = async (qText) => {
        const targetQ = qText || query;
        if (!targetQ.trim()) return;

        setLoading(true);
        setConfirmMessage(null);
        try {
          const res = await authFetch('/copilot/query', {
            method: 'POST',
            body: JSON.stringify({ query: targetQ })
          });
          const data = await res.json();
          setResponse(data);
        } catch (e) {
          console.error("Copilot query failed", e);
        } finally {
          setLoading(false);
        }
      };

      const handleConfirmAction = async (actionType) => {
        setConfirmLoading(true);
        try {
          const res = await authFetch('/copilot/confirm', {
            method: 'POST',
            body: JSON.stringify({ action_type: actionType, actor: 'COPILOT_ADMIN' })
          });
          const data = await res.json();
          setConfirmMessage(data.message);
          setResponse(prev => ({ ...prev, requires_confirmation: false }));
        } catch (e) {
          console.error("Failed to confirm copilot action", e);
        } finally {
          setConfirmLoading(false);
        }
      };

      return (
        <div className="ledger-panel p-6 space-y-5 font-jetbrains">
          <div className="flex items-center justify-between border-b border-ledger-border pb-3">
            <div className="flex items-center space-x-2.5 text-amber-gold font-bold">
              <span className="w-2.5 h-2.5 rounded-full bg-teal-success animate-pulse"></span>
              <span className="uppercase tracking-widest text-xs">RECOVERAI COPILOT // OPERATIONS ANALYST</span>
            </div>
            <span className="text-[10px] text-teal-success font-bold font-mono">● CONNECTED TO RECOVERY CONTROL PLANE</span>
          </div>

          <div className="flex space-x-2">
            <input
              type="text"
              placeholder="Ask about recovery drops, transactions, policy blocks, intervention lift, or simulations..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleQuery()}
              className="w-full bg-ledger-bg border border-ledger-border text-text-primary px-4 py-2.5 text-xs font-mono focus:border-amber-gold focus:outline-none"
            />
            <button
              onClick={() => handleQuery()}
              disabled={loading}
              className="px-5 py-2.5 bg-amber-gold text-ledger-bg font-bold text-xs uppercase hover:bg-amber-gold/90 transition shrink-0"
            >
              {loading ? 'ANALYZING...' : 'QUERY'}
            </button>
          </div>

          <div className="flex flex-wrap gap-2 text-[10px] text-text-muted">
            <span className="py-1 font-bold text-text-primary">Suggested Operations Queries:</span>
            {presets.map((p, idx) => (
              <button
                key={idx}
                onClick={() => { setQuery(p); handleQuery(p); }}
                className="px-2.5 py-1 bg-ledger-card-subtle border border-ledger-border hover:border-amber-gold hover:text-text-primary transition"
              >
                {p}
              </button>
            ))}
          </div>

          {loading && (
            <div className="bg-ledger-card-subtle p-3 border border-amber-gold/30 text-xs font-mono space-y-1 text-amber-gold">
              <div className="flex items-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-amber-gold animate-ping"></span>
                <span className="font-bold">ANALYZING RECOVERY DATA...</span>
              </div>
              <div className="text-[10px] text-text-muted pl-4">
                ✓ Querying RecoverAI control plane services & structured database tools...
              </div>
            </div>
          )}

          {confirmMessage && (
            <div className="bg-teal-success/10 border border-teal-success/40 p-3 text-xs text-teal-success font-mono font-bold">
              ✓ {confirmMessage}
            </div>
          )}

          {!loading && response && (
            <div className="bg-ledger-card-subtle p-5 border border-ledger-border space-y-4 text-xs">
              <div className="flex items-center justify-between border-b border-ledger-border/60 pb-2">
                <span className="text-[10px] text-amber-gold font-bold uppercase tracking-wider">
                  INTENT: {response.intent || 'RECOVERY_ANALYSIS'}
                </span>
                {response.tools_called && response.tools_called.length > 0 && (
                  <span className="text-[10px] text-text-muted font-mono">
                    TOOLS EXECUTED: {response.tools_called.join(', ')}
                  </span>
                )}
              </div>

              <div className="text-text-primary leading-relaxed font-sans text-xs whitespace-pre-line">
                {response.answer || response.explanation}
              </div>

              {response.requires_confirmation && (
                <div className="bg-amber-gold/10 border border-amber-gold/40 p-3 flex items-center justify-between">
                  <span className="text-amber-gold font-bold text-[11px]">Action requires explicit confirmation.</span>
                  <button
                    onClick={() => handleConfirmAction(response.action_type || 'PAUSE_AUTOMATION')}
                    disabled={confirmLoading}
                    className="px-3 py-1 bg-amber-gold text-ledger-bg font-bold text-[10px] uppercase hover:bg-amber-gold/90 transition"
                  >
                    {confirmLoading ? 'CONFIRMING...' : 'CONFIRM ACTION'}
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 3. LANDING PAGE VIEW
    // -------------------------------------------------------------------------
    function LandingView({ onNavigate }) {
      return (
        <div className="max-w-7xl mx-auto px-6 py-16 font-jetbrains space-y-16">
          <div className="text-center space-y-6 max-w-4xl mx-auto">
            <div className="inline-flex items-center space-x-2 bg-amber-gold/10 border border-amber-gold/30 px-3.5 py-1.5 text-xs text-amber-gold font-bold uppercase tracking-widest">
              <span className="w-2 h-2 rounded-full bg-amber-gold animate-pulse"></span>
              <span>AUTONOMOUS REVENUE RECOVERY CONTROL PLANE FOR MERCHANTS</span>
            </div>
            <h1 className="font-serif-headline text-6xl sm:text-7xl text-text-primary leading-tight">
              Recover lost revenue on <span className="italic text-amber-gold">autopilot</span>. Zero dev effort.
            </h1>
            <p className="font-sans text-base text-text-muted max-w-2xl mx-auto leading-relaxed">
              RecoverAI ingests Razorpay payment failures, scores risk, enforces governance rules, and executes autonomous retry strategies to maximize recovery rate while protecting your customer relationship.
            </p>
            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
              <button
                onClick={() => onNavigate('signup')}
                className="w-full sm:w-auto px-8 py-4 bg-amber-gold text-ledger-bg font-bold text-xs uppercase tracking-wider hover:bg-amber-gold/90 transition shadow-lg shadow-amber-gold/20"
              >
                CREATE MERCHANT ACCOUNT →
              </button>
              <button
                onClick={() => onNavigate('login')}
                className="w-full sm:w-auto px-8 py-4 border border-ledger-border text-text-primary font-bold text-xs uppercase tracking-wider hover:border-amber-gold hover:text-amber-gold transition"
              >
                SIGN IN TO WORKSPACE
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 pt-8">
            <div className="ledger-panel p-6 space-y-3">
              <div className="text-amber-gold text-xs font-bold uppercase tracking-wider">01 // AUTOMATED WEBHOOK INGESTION</div>
              <h3 className="font-serif-headline text-2xl text-text-primary">Instant Webhook Normalization</h3>
              <p className="font-sans text-xs text-text-muted leading-relaxed">
                Connect Razorpay webhooks in 60 seconds. Deduplicates payment failures and normalizes failure reasons across UPI, Cards, and Netbanking.
              </p>
            </div>
            <div className="ledger-panel p-6 space-y-3">
              <div className="text-amber-gold text-xs font-bold uppercase tracking-wider">02 // DETERMINISTIC POLICY ENGINE</div>
              <h3 className="font-serif-headline text-2xl text-text-primary">Kill Switch & Exposure Caps</h3>
              <p className="font-sans text-xs text-text-muted leading-relaxed">
                Set safety limits, cooldown periods, and maximum retry attempts. Require manual human approval for high-value transactions above your threshold.
              </p>
            </div>
            <div className="ledger-panel p-6 space-y-3">
              <div className="text-amber-gold text-xs font-bold uppercase tracking-wider">03 // REVENUE COPILOT ANALYST</div>
              <h3 className="font-serif-headline text-2xl text-text-primary">AI Control Plane Analyst</h3>
              <p className="font-sans text-xs text-text-muted leading-relaxed">
                Ask Copilot to investigate transaction drops, explain policy blocks, evaluate recovery lift, or pause automation on demand with full auditability.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 4. SIGNUP VIEW
    // -------------------------------------------------------------------------
    function SignupView({ onSuccess, onNavigate }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email,
              password,
              full_name: fullName,
              company_name: companyName
            })
          });
          let data;
          try {
            data = await res.json();
          } catch (jsonErr) {
            data = { detail: res.statusText || 'Registration server error. Please try again.' };
          }
          if (!res.ok) throw new Error(data.detail || data.message || 'Signup failed');
          localStorage.setItem('rai_session_token', data.session_token);
          onSuccess(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto my-16 p-8 ledger-panel font-jetbrains space-y-6">
          <div className="border-b border-ledger-border pb-4">
            <div className="text-xs text-amber-gold font-bold uppercase tracking-wider">MERCHANT ONBOARDING</div>
            <h2 className="font-serif-headline text-3xl text-text-primary mt-1">Create your RecoverAI Account</h2>
          </div>

          {error && (
            <div className="bg-danger-red/10 border border-danger-red/40 p-3 text-xs text-danger-red font-mono">
              ⚠️ {error}
            </div>
          )}

          <form onSubmit={handleSubmit} className="space-y-4 text-xs font-mono">
            <div>
              <label className="block text-text-muted uppercase mb-1">Full Name</label>
              <input
                type="text"
                required
                value={fullName}
                onChange={(e) => setFullName(e.target.value)}
                placeholder="e.g. Jane Doe"
                className="w-full bg-ledger-bg border border-ledger-border text-text-primary p-3 focus:border-amber-gold focus:outline-none"
              />
            </div>
            <div>
              <label className="block text-text-muted uppercase mb-1">Merchant / Company Name</label>
              <input
                type="text"
                required
                value={companyName}
                onChange={(e) => setCompanyName(e.target.value)}
                placeholder="e.g. Acme Tech Solutions"
                className="w-full bg-ledger-bg border border-ledger-border text-text-primary p-3 focus:border-amber-gold focus:outline-none"
              />
            </div>
            <div>
              <label className="block text-text-muted uppercase mb-1">Work Email</label>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="jane@acme.com"
                className="w-full bg-ledger-bg border border-ledger-border text-text-primary p-3 focus:border-amber-gold focus:outline-none"
              />
            </div>
            <div>
              <label className="block text-text-muted uppercase mb-1">Password</label>
              <input
                type="password"
                required
                minLength={6}
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••••••"
                className="w-full bg-ledger-bg border border-ledger-border text-text-primary p-3 focus:border-amber-gold focus:outline-none"
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full py-3.5 bg-amber-gold text-ledger-bg font-bold text-xs uppercase hover:bg-amber-gold/90 transition tracking-wider"
            >
              {loading ? 'CREATING WORKSPACE...' : 'CREATE ACCOUNT & WORKSPACE →'}
            </button>
          </form>

          <div className="text-center text-xs text-text-muted pt-2">
            Already registered?{' '}
            <button onClick={() => onNavigate('login')} className="text-amber-gold underline hover:text-white">
              Sign In
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // 5. LOGIN VIEW
    // -------------------------------------------------------------------------
    function LoginView({ onSuccess, onNavigate }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          let data;
          try {
            data = await res.json();
          } catch (jsonErr) {
            data = { detail: res.statusText || 'Authentication server error. Please try again.' };
          }
          if (!res.ok) throw new Error(data.detail || data.message || 'Login failed');
          localStorage.setItem('rai_session_token', data.session_token);
          onSuccess(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto my-16 p-8 ledger-panel font-jetbrains space-y-6">
          <div className="border-b border-ledger-border pb-4">
            <div className="text-xs text-amber-gold font-bold uppercase tracking-wider">SECURE ACCESS</div>
            <h2 className="font-serif-headline text-3xl text-text-primary mt-1">Sign in to RecoverAI</h2>
          </div>

          {error && (
            <div className="bg-danger-red/10 border border-danger-red/40 p-3 text-xs text-danger-red font-mono">
              ⚠️ {error}
            </div>
          )}

          <form onSubmit={handleSubmit} className="space-y-4 text-xs font-mono">
            <div>
              <label className="block text-text-muted uppercase mb-1">Work Email</label>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="jane@acme.com"
                className="w-full bg-ledger-bg border border-ledger-border text-text-primary p-3 focus:border-amber-gold focus:outline-none"
              />
            </div>
            <div>
              <div className="flex justify-between items-center mb-1">
                <label className="text-text-muted uppercase">Password</label>
                <button
                  type="button"
                  onClick={() => onNavigate('forgot-password')}
                  className="text-[10px] text-amber-gold hover:underline"
                >
                  Forgot password?
                </button>
              </div>
              <input
                type="password"

    function SettingsView({ workspace, user, onUpdateWorkspace, onLogout, onNavigate }) {
      const [activeSubTab, setActiveSubTab] = useState('api_keys');
      const [apiKeys, setApiKeys] = useState([]);
      const [newKeyName, setNewKeyName] = useState('');
      const [newKeyEnv, setNewKeyEnv] = useState('SANDBOX');
      const [createdRawKey, setCreatedRawKey] = useState(null);
      const [loading, setLoading] = useState(false);

      const fetchApiKeys = async () => {
        try {
          const res = await authFetch('/settings/api-keys');
          const data = await res.json();
          setApiKeys(data.api_keys || []);
        } catch (e) {
          console.error("Failed to fetch API keys", e);
        }
      };

      useEffect(() => {
        if (activeSubTab === 'api_keys') {
          fetchApiKeys();
        }
      }, [activeSubTab]);

      const handleGenerateApiKey = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await authFetch('/settings/api-keys', {
            method: 'POST',
            body: JSON.stringify({ name: newKeyName || 'Secret Key', environment: newKeyEnv })
          });
          const data = await res.json();
          setCreatedRawKey(data.raw_api_key);
          setNewKeyName('');
          fetchApiKeys();
        } catch (err) {
          console.error("Failed to generate API key", err);
        } finally {
          setLoading(false);
        }
      };

      const handleRevokeApiKey = async (keyId) => {
        try {
          await authFetch(`/settings/api-keys/${keyId}`, { method: 'DELETE' });
          fetchApiKeys();
        } catch (e) {
          console.error("Failed to revoke API key", e);
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-6 py-10 font-jetbrains space-y-8">

    // -------------------------------------------------------------------------
    // 10. MAIN RECOVERAI APPLICATION WITH MULTI-TENANT AUTH & ONBOARDING
    // -------------------------------------------------------------------------
    function App() {
      const getRouteFromLocation = () => {
        const path = window.location.pathname;
        const hash = window.location.hash.replace('#', '');
        if (path.includes('landing') || hash.includes('landing')) return 'landing';
        if (path.includes('signup') || hash.includes('signup')) return 'signup';
        if (path.includes('login') || hash.includes('login')) return 'login';
        if (path.includes('forgot-password') || hash.includes('forgot-password')) return 'forgot-password';
        if (path.includes('onboarding') || hash.includes('onboarding')) return 'onboarding';
        if (path.includes('settings') || hash.includes('settings')) return 'settings';
        if (path.includes('audit-trail') || hash.includes('audit-trail')) return 'audit';
        if (path.includes('recovery') || hash.includes('recovery')) return 'recovery';
        if (path.includes('policy-engine') || hash.includes('policy-engine')) return 'policy';
        if (path.includes('simulator') || hash.includes('simulator')) return 'simulator';
        return 'command_center';
      };

      const [activeTab, setActiveTab] = useState(getRouteFromLocation());
      const [user, setUser] = useState(null);
      const [workspace, setWorkspace] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [showUserDropdown, setShowUserDropdown] = useState(false);

      const [brief, setBrief] = useState(null);
      const [summary, setSummary] = useState(null);
      const [cases, setCases] = useState([]);
      const [selectedCase, setSelectedCase] = useState(null);
      const [simulator, setSimulator] = useState(null);
      const [govConfig, setGovConfig] = useState(null);
      const [pendingApprovals, setPendingApprovals] = useState([]);
      const [impactData, setImpactData] = useState(null);
      const [experimentsData, setExperimentsData] = useState([]);
      const [showPauseModal, setShowPauseModal] = useState(false);
      const [categoryFilter, setCategoryFilter] = useState('');
      const [actionFilter, setActionFilter] = useState('');
      const [outcomeFilter, setOutcomeFilter] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [page, setPage] = useState(1);
      const [totalPages, setTotalPages] = useState(1);
      const [loading, setLoading] = useState(true);

      const checkAuthStatus = async () => {
        try {
          const res = await authFetch('/auth/me');
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            setWorkspace(data.workspace);
          } else {
            setUser(null);
            setWorkspace({ id: 'ws_default', name: 'Default Sandbox Merchant', environment: 'SANDBOX' });
          }
        } catch (e) {
          console.error("Auth status check failed", e);
        } finally {
          setAuthChecked(true);
        }
      };

      const fetchImpactAnalytics = async () => {
        try {
          const res = await authFetch('/analytics/recovery-impact');
          const data = await res.json();
          setImpactData(data);
        } catch (e) {
          console.error("Failed to fetch recovery impact analytics", e);
        }
      };

      const fetchExperiments = async () => {
        try {
          const res = await authFetch('/experiments');
          const data = await res.json();
          setExperimentsData(data.experiments || []);
        } catch (e) {
          console.error("Failed to fetch experiments", e);
        }
      };

      const fetchGovernanceConfig = async () => {
        try {
          const res = await authFetch('/governance/config');
          const data = await res.json();
          setGovConfig(data);
        } catch (e) {
          console.error("Failed to fetch governance config", e);
        }
      };

      const fetchPendingApprovals = async () => {
        try {
          const res = await authFetch('/governance/approvals');
          const data = await res.json();
          setPendingApprovals(data.approvals || []);
        } catch (e) {
          console.error("Failed to fetch pending approvals", e);
        }
      };

      const handleToggleKillSwitch = async (active) => {
        try {
          await authFetch('/governance/kill-switch', {
            method: 'POST',
            body: JSON.stringify({ active, actor: user?.email || 'ADMIN', reason: active ? 'Manual resume' : 'Emergency safety pause' })
          });
          fetchGovernanceConfig();
          setShowPauseModal(false);
        } catch (e) {
          console.error("Failed to toggle kill switch", e);
        }
      };

      const handleApprovalDecision = async (approvalId, decision) => {
        try {
          await authFetch(`/governance/approvals/${approvalId}/decision`, {
            method: 'POST',

        setWorkspace({ id: 'ws_default', name: 'Default Sandbox Merchant', environment: 'SANDBOX' });

          setActiveTab(r);

        window.addEventListener('hashchange', syncLocation);
        return () => {

          window.removeEventListener('hashchange', syncLocation);

        fetchCases();

        try {

          const detail = await res.json();
          setSelectedCase(detail);

                  <div className="text-xs font-mono text-text-muted mt-1">
                    TRACE ID: trace_7f91ac_{selectedCase.event_id}
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-ledger-card-subtle p-4 border border-ledger-border text-xs">
                  <div>
                    <span className="text-text-muted text-[10px] block">AMOUNT AT RISK</span>
                    <span className="font-bold text-text-primary text-sm">₹{selectedCase.amount.toLocaleString('en-IN')}</span>
                  </div>
                  <div>
                    <span className="text-text-muted text-[10px] block">RECOVERED</span>
                    <span className="font-bold text-teal-success text-sm">₹{selectedCase.revenue_recovered ? selectedCase.revenue_recovered.toLocaleString('en-IN') : Math.round(selectedCase.amount * selectedCase.recovery_probability).toLocaleString('en-IN')}</span>
                  </div>
                  <div>
                    <span className="text-text-muted text-[10px] block">RECOVERY PROB</span>
                    <span className="font-bold text-teal-success text-sm">{(selectedCase.recovery_probability * 100).toFixed(1)}%</span>
                  </div>
                  <div>
                    <span className="text-text-muted text-[10px] block">STATUS</span>
                    <span className={`font-bold ${selectedCase.outcome === 'SUCCESS' ? 'text-teal-success' : 'text-amber-gold'}`}>
                      {selectedCase.outcome === 'SUCCESS' ? 'RECOVERED ✓' : selectedCase.outcome}
                    </span>
                  </div>
                </div>

                {selectedCase.blocking_rule && (
                  <div className="bg-amber-gold/10 border border-amber-gold/40 p-3 text-xs text-amber-gold">
                    <span className="font-bold">⚠️ POLICY RULE OVERRIDE:</span> AI action <code className="bg-black px-1.5 py-0.5">{selectedCase.recommended_action}</code> blocked by rule <code className="bg-black px-1.5 py-0.5">{selectedCase.blocking_rule}</code>.
                  </div>
                )}

                <div className="space-y-1 pt-2">
                  <div className="text-[10px] uppercase text-text-muted font-bold">AI DIAGNOSTIC REASONING</div>
                  <div className="bg-ledger-card-subtle p-4 text-xs italic text-text-primary border border-ledger-border leading-relaxed">
                    "{selectedCase.reasoning_text}"
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4 border-t border-ledger-border text-xs text-text-muted">
                  <span>✓ 100% AUDITABLE SHA256 RECORD</span>
                  <button
                    onClick={() => setSelectedCase(null)}
                    className="px-5 py-2.5 bg-amber-gold text-ledger-bg font-bold uppercase hover:bg-amber-gold/90 transition"
                  >
                    CLOSE INVESTIGATION
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-ledger-border py-12 bg-ledger-bg text-text-muted font-jetbrains text-xs">
            <div className="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
              <div>
                <div className="flex items-center space-x-2.5 mb-1">
                  <AngularRLogo size={20} />
                  <span className="font-bold text-text-primary text-base font-jetbrains">Recover<span className="text-amber-gold">AI</span></span>
                </div>
                <p className="text-[11px] text-text-muted">AUTONOMOUS REVENUE RECOVERY CONTROL PLANE. BUILT FOR CONTROLLED EXECUTION.</p>
              </div>
              <div className="text-right text-[11px] text-text-muted">
                <span>© 2026 RecoverAI • Multi-tenant Workspace Isolation Active</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
